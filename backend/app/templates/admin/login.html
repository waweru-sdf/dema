{% extends "admin/base.html" %}
{% block title %}Sign in{% endblock %}
{% block public %}
<div style="min-height:100vh;display:grid;place-items:center;padding:20px">
  <form method="post" class="card" style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:18px">
      <img src="/assets/img/logo.png" alt="" width="70" height="70" style="margin:0 auto">
      <h1 style="margin:10px 0 0">Staff sign in</h1>
    </div>
    {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <p><label for="username">Username</label><br><input id="username" name="username" autocomplete="username" required style="width:100%"></p>
    <p><label for="password">Password</label><br><input id="password" name="password" type="password" autocomplete="current-password" required style="width:100%"></p>
    <button class="btn" type="submit" style="width:100%;justify-content:center">Sign in</button>
  </form>
</div>
{% endblock %}
